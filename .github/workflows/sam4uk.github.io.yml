# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  workflow_dispatch:
  # Runs on pushes targeting the default branch
  push:
    branches: ["public"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo from Ubuntu repo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SECRET_1 }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: content
        run: |
          git submodule add https://${{ secrets.SECRET_1 }}@github.com/Sam4uk/content.git content
          git submodule update --init --recursive
      
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Створюю структуру каталогів
        run: |
          mkdir -p \
            ./public/dists/focal/main/binary-arm64 \
            ./public/dists/focal/main/binary-amd64 \
            ./public/dists/focal/main/binary-all 

      - name: Додаю пакунки
        run: |
          wget https://sam4uk.github.io/yb/yb-0.9-0.deb -P ./public/dists/focal/main/binary-all
          wget https://sam4uk.github.io/quectel-CM/quectel-1.6.2-amd64.deb -P ./public/dists/focal/main/binary-amd64
               
      - name: генерую мета дані
        run: |
          cd ./public
          dpkg-scanpackages -m . > dists/focal/main/binary-amd64/Packages
          dpkg-scanpackages -m . > dists/focal/main/binary-arm64/Packages
          dpkg-scanpackages -m . > dists/focal/main/binary-all/Packages
          gzip -k dists/focal/main/binary-amd64/Packages
          gzip -k dists/focal/main/binary-arm64/Packages
          gzip -k dists/focal/main/binary-all/Packages
          apt-ftparchive release dists/focal/ > dists/focal/Release

      - run: tree

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
