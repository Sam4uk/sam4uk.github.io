# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  workflow_dispatch:
  # Runs on pushes targeting the default branch
  push:
    branches: ["public"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  RESUME_FILES: "content/ua/resume.md" # content/en/resume.md"
  RESUME_TEMPLATE: pandoc/eurocv-template.latex

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo from Ubuntu repo
        run: |
          LATEST=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${LATEST}/hugo_extended_${LATEST}_linux-amd64.deb" -O /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb || sudo apt-get install -f -y

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SECRET_1 }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: content
        run: |
          git submodule add https://${{ secrets.SECRET_1 }}@github.com/Sam4uk/content.git content
          git submodule update --init --recursive

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # ----------------------------------------------------------------
      # CV: генерація PDF
      # ----------------------------------------------------------------
      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: latex-${{ runner.os }}-v1
          restore-keys: |
            latex-${{ runner.os }}-

      - name: Install pandoc & LaTeX
        run: |
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-lang-cyrillic \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            fonts-liberation

      - name: Generate CV (tex → pdf)
        run: |
          LOGIN="${{ github.actor }}"

          for RESUME_SOURCE in $RESUME_FILES; do
            # content/ua/resume.md → LANG=ua, DESCRIPTION=resume
            LANG=$(echo "$RESUME_SOURCE" | cut -d'/' -f2)
            DESCRIPTION=$(basename "$RESUME_SOURCE" .md)

            CV_NAME="CV_${LOGIN}_${DESCRIPTION}_${LANG}"
            OUTPUT_DIR="./public/${LANG}/resume"

            echo "--- Generating: ${CV_NAME} ---"
            mkdir -p "$OUTPUT_DIR"

            # --- Markdown → .tex ---
            pandoc "$RESUME_SOURCE" \
              --template="$RESUME_TEMPLATE" \
              --from=markdown \
              --to=latex \
              --output="${OUTPUT_DIR}/${CV_NAME}.tex"

            # --- .tex → .pdf (два проходи для коректних посилань/змісту) ---
            xelatex \
              -interaction=nonstopmode \
              -output-directory="$OUTPUT_DIR" \
              "${OUTPUT_DIR}/${CV_NAME}.tex"

            xelatex \
              -interaction=nonstopmode \
              -output-directory="$OUTPUT_DIR" \
              "${OUTPUT_DIR}/${CV_NAME}.tex"

            echo "✓ PDF ready: ${OUTPUT_DIR}/${CV_NAME}.pdf"
          done

      - name: Verify CV PDFs exist
        run: |
          for RESUME_SOURCE in $RESUME_FILES; do
            LANG=$(echo "$RESUME_SOURCE" | cut -d'/' -f2)
            DESCRIPTION=$(basename "$RESUME_SOURCE" .md)
            CV_NAME="CV_${{ github.actor }}_${DESCRIPTION}_${LANG}"
            ls -lh "./public/${LANG}/resume/${CV_NAME}.pdf"
          done

      # ----------------------------------------------------------------
      # APT repo
      # ----------------------------------------------------------------
      - name: Створюю структуру каталогів
        run: |
          mkdir -p \
            ./public/dists/focal/main/binary-arm64 \
            ./public/dists/focal/main/binary-amd64 \
            ./public/dists/focal/main/binary-all

      - name: Додаю пакунки
        run: |
          wget https://sam4uk.github.io/yb/yb-0.9-0.deb \
            -P ./public/dists/focal/main/binary-all
          wget https://sam4uk.github.io/quectel-CM/quectel-1.6.2-amd64.deb \
            -P ./public/dists/focal/main/binary-amd64

      - name: Генерую мета дані
        run: |
          cd ./public
          dpkg-scanpackages -m . > dists/focal/main/binary-amd64/Packages
          dpkg-scanpackages -m . > dists/focal/main/binary-arm64/Packages
          dpkg-scanpackages -m . > dists/focal/main/binary-all/Packages
          gzip -k dists/focal/main/binary-amd64/Packages
          gzip -k dists/focal/main/binary-arm64/Packages
          gzip -k dists/focal/main/binary-all/Packages
          apt-ftparchive release dists/focal/ > dists/focal/Release

      - run: tree

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4